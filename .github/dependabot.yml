# Weekly dependency bumps; minor/patch grouped into one PR per ecosystem so CI (and Security) runs once per batch.
# `target-branch: dev`: main is the default branch (Scorecard scores it), but work lands on dev first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
